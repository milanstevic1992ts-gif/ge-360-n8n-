name: Sync upstream n8n sources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - upstream/sources.tsv
      - scripts/sync-upstream.sh
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GE360
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install sync dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Import selected upstream repositories
        run: bash scripts/sync-upstream.sh

      - name: Commit synchronized sources
        run: |
          git config user.name "ge360-sync-bot"
          git config user.email "ge360-sync-bot@users.noreply.github.com"
          git add upstream integrations references
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "chore: sync upstream n8n sources [skip ci]"
          git push
