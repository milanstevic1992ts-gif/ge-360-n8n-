name: Validate GE360 runtime

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "bin/**"
      - "deploy/**"
      - "packs/**"
      - ".env.example"
      - ".github/workflows/validate-runtime.yml"
  pull_request:
    paths:
      - "install.sh"
      - "bin/**"
      - "deploy/**"
      - "packs/**"
      - ".env.example"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell
        run: |
          bash -n install.sh
          bash -n bin/ge360ctl
          bash -n bin/n8n-agentctl
          bash -n bin/workflow-guard

      - name: Validate pack manifests
        run: |
          find packs -name pack.json -print0 | while IFS= read -r -d '' f; do
            jq -e '.id and .name and .version and (.community_packages|type=="array")' "$f" >/dev/null
          done

      - name: Validate Jarvis control contract
        run: |
          jq -e '.primaryTransport and .fallbackTransport and .cli.capabilities and .validators' jarvis/control-contract.json >/dev/null
          jq -e '.rules and .toolPriority' jarvis/policy.json >/dev/null

      - name: Validate workflow JSON
        run: |
          find packs -path '*/workflows/*.json' -print0 | while IFS= read -r -d '' f; do
            jq -e '.name and (.nodes|type=="array") and (.connections|type=="object")' "$f" >/dev/null
          done

      - name: Validate Compose
        run: |
          cp .env.example .env
          mkdir -p .secrets
          cat > .secrets/jarvis-n8n.env <<'EOF'
          N8N_AGENT_URL=http://127.0.0.1:5678/api/v1
          N8N_AGENT_API_KEY=test
          N8N_API_KEY=test
          AUTH_TOKEN=0123456789012345678901234567890123456789012345678901234567890123
          MCP_AUTH_TOKEN=0123456789012345678901234567890123456789012345678901234567890123
          EOF
          docker compose --env-file .env -f deploy/compose.yml config >/dev/null
          docker compose --env-file .env -f deploy/compose.yml -f deploy/compose.jarvis.yml config >/dev/null

      - name: Build Jarvis toolbox
        run: |
          docker build -t ge360-jarvis-toolbox-test deploy/jarvis-toolbox
